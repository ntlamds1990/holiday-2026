<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Family Trip 2026 — Nicholas & Family</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: #f0f2f5; color: #111; -webkit-font-smoothing: antialiased; }

/* ── Header / Nav ── */
#trip-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid #e8e9ec;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
  padding: 12px 16px 0;
}
#header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#trip-title { font-size: 14px; font-weight: 800; color: #111; }
#trip-meta { font-size: 11px; color: #888; margin-top: 1px; }
#summary-btn {
  background: #111; color: #fff; border: none; border-radius: 20px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
#day-nav {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
#day-nav::-webkit-scrollbar { display: none; }
.day-pill {
  flex-shrink: 0; padding: 5px 11px; border-radius: 20px; border: none;
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  background: #f0f2f5; color: #666; transition: background .15s;
}
.day-pill.today { background: #111; color: #fff; }
.day-pill.past { opacity: .45; }
.day-pill:not(.today):not(.past):hover { background: #e0e2e5; }

/* ── Main ── */
#days-container { padding: 14px; max-width: 620px; margin: 0 auto; }

/* ── Day Card ── */
.day-card {
  border-radius: var(--r); overflow: hidden;
  margin-bottom: 14px; box-shadow: 0 2px 14px rgba(0,0,0,.07);
  background: #fff;
}
.day-hero {
  height: 110px; background-size: cover; background-position: center;
  position: relative;
}
.day-hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.18) 0%, rgba(255,255,255,1) 100%);
}
.day-hero-text {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1;
  padding: 10px 16px 6px;
}
.day-date-label { font-size: 19px; font-weight: 900; color: #111; line-height: 1.1; }
.day-location-label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .7px; }
.today-tag {
  display: inline-block; background: #e53e3e; color: #fff;
  font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .5px; margin-left: 6px; vertical-align: middle;
}

/* ── Card Section ── */
.card-section {
  padding: 12px 16px;
  border-top: 1px solid #f2f2f2;
  background: #fff;
}
.section-label {
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  color: #bbb; margin-bottom: 9px;
}

/* ── Lodging pill ── */
.lodging-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lodging-name { font-size: 13px; font-weight: 700; color: #111; }
.status-chip {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
}
.chip-booked { background: #dcfce7; color: #15803d; }
.chip-tbc { background: #fef9c3; color: #92400e; }
.doc-link {
  font-size: 11px; color: #0066cc; text-decoration: none; font-weight: 600;
  background: #e8f0fe; padding: 2px 8px; border-radius: 20px;
}
.checkin-tag { font-size: 10px; color: #6b7280; font-weight: 600; }

/* ── Flight card ── */
.flight-card {
  border-radius: 10px; padding: 12px 14px; margin-bottom: 6px;
  background: linear-gradient(135deg, #0f1729 0%, #1e3a6e 100%);
  color: #fff;
}
.flight-card:last-child { margin-bottom: 0; }
.flight-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.flight-num { font-size: 11px; font-weight: 800; opacity: .65; letter-spacing: 1px; }
.flight-status-chip { font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: #22c55e; color: #fff; }
.flight-route { display: flex; align-items: center; gap: 6px; }
.flight-iata { font-size: 24px; font-weight: 900; letter-spacing: -1px; }
.flight-mid { flex: 1; text-align: center; }
.flight-arrow { font-size: 12px; opacity: .5; display: block; }
.flight-duration { font-size: 9px; opacity: .5; }
.flight-times { display: flex; justify-content: space-between; font-size: 11px; opacity: .7; margin-top: 6px; }
.flight-cabin { font-size: 10px; opacity: .55; margin-top: 4px; }

/* ── Timeline ── */
.timeline-item {
  display: flex; gap: 8px; align-items: flex-start;
  margin-bottom: 9px;
}
.timeline-item:last-child { margin-bottom: 0; }
.tl-time { font-size: 11px; font-weight: 700; color: #aaa; min-width: 42px; padding-top: 1px; flex-shrink: 0; }
.tl-icon { font-size: 13px; min-width: 18px; text-align: center; flex-shrink: 0; margin-top: 1px; }
.tl-body { flex: 1; }
.tl-text { font-size: 13px; line-height: 1.45; color: #222; }
.tl-map { display: inline-block; font-size: 10px; color: #0066cc; text-decoration: none; font-weight: 600; margin-top: 2px; }

/* ── Meals ── */
.meal-item { font-size: 13px; color: #333; margin-bottom: 6px; line-height: 1.4; }
.meal-item:last-child { margin-bottom: 0; }
.meal-tag { font-size: 10px; font-weight: 700; color: #888; margin-right: 4px; }

/* ── Expense log ── */
.expense-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.expense-day-total { font-size: 13px; font-weight: 800; color: #111; }
.add-btn {
  background: #111; color: #fff; border: none; border-radius: 20px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.expense-empty { font-size: 12px; color: #ccc; font-style: italic; }
.expense-item {
  display: flex; align-items: center; gap: 6px; padding: 6px 0;
  border-bottom: 1px solid #f5f5f5;
}
.expense-item:last-child { border-bottom: none; }
.exp-cat { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.exp-desc { flex: 1; font-size: 13px; color: #222; }
.exp-method { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
.exp-amt { font-size: 13px; font-weight: 800; color: #111; flex-shrink: 0; }
.exp-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: 15px; padding: 0 2px; flex-shrink: 0; }
.exp-del:hover { color: #e53e3e; }

/* Category colours */
.cat-food    { background: #f59e0b; } .method-food    { background: #fef3c7; color: #92400e; }
.cat-transport { background: #3b82f6; } .method-transport { background: #dbeafe; color: #1e40af; }
.cat-activities { background: #8b5cf6; } .method-activities { background: #f3e8ff; color: #6b21a8; }
.cat-shopping  { background: #ec4899; } .method-shopping  { background: #fce7f3; color: #9d174d; }
.cat-other   { background: #94a3b8; } .method-other   { background: #f1f5f9; color: #475569; }

/* Payment method chips */
.pm-uob   { background: #dbeafe; color: #1e40af; }
.pm-dbs   { background: #dcfce7; color: #166534; }
.pm-cash  { background: #fef9c3; color: #854d0e; }
.pm-amex  { background: #ede9fe; color: #5b21b6; }
.pm-visa  { background: #fff7ed; color: #c2410c; }
.pm-other { background: #f1f5f9; color: #475569; }

/* ── City hero gradients ── */
.hero-nyc     { background: linear-gradient(135deg, #0f1729, #1a3a6e, #2d5282); }
.hero-dfw     { background: linear-gradient(135deg, #3d1a06, #7c3b0e, #c26a2d); }
.hero-orlando { background: linear-gradient(135deg, #1a0533, #3d1580, #6d28d9); }
.hero-disney  { background: linear-gradient(135deg, #001a3d, #0050a0, #0080d0); }
.hero-vermont { background: linear-gradient(135deg, #0a200a, #1a4d1a, #3a7a3a); }
.hero-boston  { background: linear-gradient(135deg, #0a1228, #7a1020, #b91c1c); }

/* ── Summary panel ── */
#summary-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 400;
}
#summary-overlay.open { display: block; }
#summary-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-radius: 20px 20px 0 0;
  padding: 20px 20px 40px; z-index: 401;
  max-height: 70vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .28s ease;
}
#summary-overlay.open #summary-panel { transform: translateY(0); }
.panel-handle { width: 40px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 16px; }
.panel-title { font-size: 17px; font-weight: 900; margin-bottom: 16px; }
.sum-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: #aaa; margin: 16px 0 8px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
.sum-row:last-child { border-bottom: none; }
.sum-label { color: #555; display: flex; align-items: center; gap: 8px; }
.sum-amt { font-weight: 800; color: #111; }
.sum-total-row { display: flex; justify-content: space-between; padding: 12px 0; font-size: 16px; font-weight: 900; border-top: 2px solid #111; margin-top: 8px; }

/* ── Add Expense Modal ── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 500; align-items: flex-end;
}
#modal-overlay.open { display: flex; }
#expense-modal {
  background: #fff; width: 100%; border-radius: 20px 20px 0 0;
  padding: 24px 20px 40px;
}
#modal-day-label { font-size: 12px; color: #999; font-weight: 600; margin-bottom: 4px; }
#modal-title { font-size: 17px; font-weight: 900; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #aaa; margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 11px 12px; border: 1.5px solid #e8e8e8; border-radius: 10px;
  font-size: 15px; font-family: var(--font); outline: none; background: #fff;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: #111; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel {
  flex: 1; padding: 13px; border: 1.5px solid #e8e8e8; border-radius: 12px;
  background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
}
.btn-save {
  flex: 2; padding: 13px; border: none; border-radius: 12px;
  background: #111; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font);
}

@media (min-width: 600px) {
  #modal-overlay { align-items: center; }
  #expense-modal { border-radius: 20px; max-width: 440px; margin: 0 auto; }
  #summary-panel { max-width: 480px; left: 50%; right: auto; transform: translateX(-50%) translateY(100%); }
  #summary-overlay.open #summary-panel { transform: translateX(-50%) translateY(0); }
}
</style>
</head>

<div id="app">
  <div id="trip-header">
    <div id="header-top">
      <div>
        <div id="trip-title">Family Trip 2026 — Nicholas &amp; Family</div>
        <div id="trip-meta">14 Dec 2026 – 1 Jan 2027 &nbsp;·&nbsp; 5 travellers</div>
      </div>
      <button id="summary-btn" onclick="openSummary()">💰 Spend</button>
    </div>
    <div id="day-nav"></div>
  </div>
  <div id="days-container"></div>
</div>

<!-- Summary Panel -->
<div id="summary-overlay" onclick="closeSummary(event)">
  <div id="summary-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">Trip Spend Log</div>
    <div id="summary-content"></div>
  </div>
</div>

<!-- Add Expense Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="expense-modal">
    <div id="modal-day-label"></div>
    <div id="modal-title">Add Expense</div>
    <div class="field">
      <label>Description</label>
      <input id="exp-desc" type="text" placeholder="e.g. Coffee at JFK" autocomplete="off">
    </div>
    <div class="field">
      <label>Amount (USD)</label>
      <input id="exp-amt" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="exp-cat">
        <option value="food">🍽️ Food &amp; Drink</option>
        <option value="transport">🚗 Transport</option>
        <option value="activities">🎢 Activities</option>
        <option value="shopping">🛍️ Shopping</option>
        <option value="other">📌 Other</option>
      </select>
    </div>
    <div class="field">
      <label>Payment Method</label>
      <select id="exp-method">
        <option value="uob">UOB</option>
        <option value="dbs">DBS</option>
        <option value="cash">Cash (USD)</option>
        <option value="amex">Amex</option>
        <option value="visa">Visa</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveExpense()">Add</button>
    </div>
  </div>
</div>

// ─────────────────────────────────────────────
//  EXPENSE LOG  (localStorage)
// ─────────────────────────────────────────────
const STORAGE_KEY = 'holiday2026_expenses';

function loadExpenses() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveExpenses(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getExpensesForDay(dateStr) {
  return loadExpenses()[dateStr] || [];
}
function addExpenseToDay(dateStr, item) {
  const data = loadExpenses();
  if (!data[dateStr]) data[dateStr] = [];
  data[dateStr].push({ ...item, id: Date.now() });
  saveExpenses(data);
}
function deleteExpense(dateStr, id) {
  const data = loadExpenses();
  if (data[dateStr]) data[dateStr] = data[dateStr].filter(e => e.id !== id);
  saveExpenses(data);
}
function getAllExpenses() {
  return loadExpenses();
}

const CAT_META = {
  food:       { label: 'Food & Drink', dot: 'cat-food',       badge: 'method-food'       },
  transport:  { label: 'Transport',    dot: 'cat-transport',  badge: 'method-transport'  },
  activities: { label: 'Activities',   dot: 'cat-activities', badge: 'method-activities' },
  shopping:   { label: 'Shopping',     dot: 'cat-shopping',   badge: 'method-shopping'   },
  other:      { label: 'Other',        dot: 'cat-other',      badge: 'method-other'      }
};

// ─────────────────────────────────────────────
//  RENDER HELPERS
// ─────────────────────────────────────────────
function fmt(n) { return n.toFixed(2); }

function renderExpenseList(dateStr) {
  const items = getExpensesForDay(dateStr);
  if (!items.length) return '<div class="expense-empty">No expenses logged yet</div>';
  return items.map(e => {
    const meta = CAT_META[e.cat] || CAT_META.other;
    return `<div class="expense-item" id="exp-${e.id}">
      <div class="exp-cat ${meta.dot}"></div>
      <div class="exp-desc">${e.desc}</div>
      <span class="exp-method ${`pm-${e.method}`}">${e.method.toUpperCase()}</span>
      <div class="exp-amt">$${fmt(e.amt)}</div>
      <button class="exp-del" onclick="deleteExp('${dateStr}',${e.id})">×</button>
    </div>`;
  }).join('');
}

function renderDayCard(day, isToday, isPast) {
  const today = isToday ? `<span class="today-tag">Today</span>` : '';
  const heroClass = `hero-${day.theme}`;
  const heroImg = CITY_IMAGES[day.theme]
    ? `style="background-image:url('${CITY_IMAGES[day.theme]}')"` : '';

  // Lodging block
  let lodgingHtml = '';
  if (day.lodging) {
    const ci = day.lodging.checkIn ? '<span class="checkin-tag">Check-in</span>' : '';
    const co = day.lodging.checkOut ? '<span class="checkin-tag">Check-out</span>' : '';
    const chip = day.lodging.status === 'booked'
      ? '<span class="status-chip chip-booked">✓ Booked</span>'
      : '<span class="status-chip chip-tbc">⚠ Cost TBC</span>';
    const docBtn = day.lodging.doc
      ? `<a class="doc-link" href="${day.lodging.doc}" target="_blank">📄 Receipt</a>` : '';
    lodgingHtml = `<div class="card-section">
      <div class="section-label">Lodging</div>
      <div class="lodging-row">
        <span class="lodging-name">${day.lodging.name}</span>
        ${chip} ${ci} ${co} ${docBtn}
      </div>
    </div>`;
  }

  // Flights block
  let flightsHtml = '';
  if (day.flights && day.flights.length) {
    const fCards = day.flights.map(f => {
      const docBtn = f.doc ? `<a class="doc-link" href="${f.doc}" target="_blank">🎫 Boarding pass</a>` : '';
      return `<div class="flight-card">
        <div class="flight-top">
          <span class="flight-num">${f.num} · ${f.airline}</span>
          <span class="flight-status-chip">✓ Booked</span>
        </div>
        <div class="flight-route">
          <span class="flight-iata">${f.from}</span>
          <div class="flight-mid">
            <span class="flight-arrow">──────✈──────</span>
          </div>
          <span class="flight-iata">${f.to}</span>
        </div>
        <div class="flight-times"><span>${f.dep}</span><span>${f.arr}</span></div>
        <div class="flight-cabin">${f.cabin} ${docBtn}</div>
      </div>`;
    }).join('');
    flightsHtml = `<div class="card-section">${fCards}</div>`;
  }

  // Timeline
  const tlItems = day.timeline.map(t => {
    const mapLink = t.map ? `<a class="tl-map" href="${t.map}" target="_blank">📍 Maps</a>` : '';
    return `<div class="timeline-item">
      <div class="tl-time">${t.time}</div>
      <div class="tl-icon">${t.icon}</div>
      <div class="tl-body">
        <div class="tl-text">${t.text}</div>
        ${mapLink}
      </div>
    </div>`;
  }).join('');

  // Meals
  let mealsHtml = '';
  if (day.meals && day.meals.length) {
    const mItems = day.meals.map(m =>
      `<div class="meal-item"><span class="meal-tag">${m.tag}:</span>${m.text}</div>`
    ).join('');
    mealsHtml = `<div class="card-section">
      <div class="section-label">Meals</div>
      ${mItems}
    </div>`;
  }

  // Expense log
  const dayTotal = getExpensesForDay(day.date).reduce((s, e) => s + Number(e.amt), 0);
  const totalLabel = dayTotal > 0 ? `$${fmt(dayTotal)} logged` : 'No expenses logged';
  const expenseHtml = `<div class="card-section expense-section">
    <div class="section-label">Expense Log</div>
    <div class="expense-header-row">
      <span class="expense-day-total">${totalLabel}</span>
      <button class="add-btn" onclick="openModal('${day.date}','${day.label}')">+ Add</button>
    </div>
    <div class="expense-list" id="explist-${day.date}">${renderExpenseList(day.date)}</div>
  </div>`;

  return `<div class="day-card ${isPast ? 'past-card' : ''}" id="card-${day.id}">
    <div class="day-hero ${heroClass}" ${heroImg}>
      <div class="day-hero-text">
        <div class="day-date-label">${day.label} — ${day.day}${today}</div>
        <div class="day-location-label">${day.city}</div>
      </div>
    </div>
    ${lodgingHtml}
    ${flightsHtml}
    <div class="card-section">
      <div class="section-label">Plan</div>
      ${tlItems}
    </div>
    ${mealsHtml}
    ${expenseHtml}
  </div>`;
}

// ─────────────────────────────────────────────
//  APP INIT
// ─────────────────────────────────────────────
let currentModalDate = null;

function init() {
  const today = new Date().toISOString().slice(0, 10);
  const nav = document.getElementById('day-nav');
  const container = document.getElementById('days-container');

  // Build nav pills
  nav.innerHTML = DAYS.map(d => {
    const cls = d.date === today ? 'day-pill today' : d.date < today ? 'day-pill past' : 'day-pill future';
    return `<button class="${cls}" onclick="scrollToDay('${d.id}')">${d.label}</button>`;
  }).join('');

  // Build day cards
  container.innerHTML = DAYS.map(d =>
    renderDayCard(d, d.date === today, d.date < today)
  ).join('');

  // Scroll to today
  const todayDay = DAYS.find(d => d.date === today);
  if (todayDay) {
    setTimeout(() => scrollToDay(todayDay.id), 100);
  }

  // Scroll active pill into view
  const activePill = nav.querySelector('.today');
  if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function scrollToDay(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
function openModal(dateStr, label) {
  currentModalDate = dateStr;
  document.getElementById('modal-day-label').textContent = label;
  document.getElementById('exp-desc').value = '';
  document.getElementById('exp-amt').value = '';
  document.getElementById('exp-cat').value = 'food';
  document.getElementById('exp-method').value = 'uob';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('exp-desc').focus(), 300);
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
    currentModalDate = null;
  }
}
function saveExpense() {
  if (!currentModalDate) return;
  const desc = document.getElementById('exp-desc').value.trim();
  const amt  = parseFloat(document.getElementById('exp-amt').value);
  if (!desc || isNaN(amt) || amt <= 0) {
    alert('Please enter a description and a valid amount.');
    return;
  }
  addExpenseToDay(currentModalDate, {
    desc,
    amt,
    cat: document.getElementById('exp-cat').value,
    method: document.getElementById('exp-method').value
  });
  // Refresh the expense list in the card
  const listEl = document.getElementById('explist-' + currentModalDate);
  if (listEl) listEl.innerHTML = renderExpenseList(currentModalDate);
  // Update day total label
  const total = getExpensesForDay(currentModalDate).reduce((s,e) => s + Number(e.amt), 0);
  const card = document.getElementById('card-' + DAYS.find(d => d.date === currentModalDate)?.id);
  if (card) {
    const totalEl = card.querySelector('.expense-day-total');
    if (totalEl) totalEl.textContent = total > 0 ? `$${fmt(total)} logged` : 'No expenses logged';
  }
  closeModal();
}
function deleteExp(dateStr, id) {
  deleteExpense(dateStr, id);
  const listEl = document.getElementById('explist-' + dateStr);
  if (listEl) listEl.innerHTML = renderExpenseList(dateStr);
  const total = getExpensesForDay(dateStr).reduce((s,e) => s + Number(e.amt), 0);
  const card = document.getElementById('card-' + DAYS.find(d => d.date === dateStr)?.id);
  if (card) {
    const totalEl = card.querySelector('.expense-day-total');
    if (totalEl) totalEl.textContent = total > 0 ? `$${fmt(total)} logged` : 'No expenses logged';
  }
}

// ─────────────────────────────────────────────
//  SUMMARY PANEL
// ─────────────────────────────────────────────
function openSummary() {
  const all = getAllExpenses();
  const catTotals = {};
  const methodTotals = {};
  const dayTotals = [];
  let grandTotal = 0;

  Object.entries(all).forEach(([dateStr, items]) => {
    if (!items.length) return;
    const daySum = items.reduce((s, e) => s + Number(e.amt), 0);
    grandTotal += daySum;
    const dayObj = DAYS.find(d => d.date === dateStr);
    if (dayObj) dayTotals.push({ label: dayObj.label, total: daySum });
    items.forEach(e => {
      catTotals[e.cat] = (catTotals[e.cat] || 0) + Number(e.amt);
      methodTotals[e.method] = (methodTotals[e.method] || 0) + Number(e.amt);
    });
  });

  let html = '';
  if (grandTotal === 0) {
    html = '<div style="color:#aaa;font-size:14px;text-align:center;padding:24px 0">No expenses logged yet</div>';
  } else {
    // By category
    html += '<div class="sum-section-title">By Category</div>';
    Object.entries(catTotals).sort((a,b) => b[1]-a[1]).forEach(([cat, total]) => {
      const meta = CAT_META[cat] || CAT_META.other;
      html += `<div class="sum-row"><span class="sum-label"><span class="exp-cat ${meta.dot}" style="width:8px;height:8px;border-radius:50%;display:inline-block;"></span>&nbsp;${meta.label}</span><span class="sum-amt">$${fmt(total)}</span></div>`;
    });

    // By payment method
    html += '<div class="sum-section-title">By Payment Method</div>';
    Object.entries(methodTotals).sort((a,b) => b[1]-a[1]).forEach(([method, total]) => {
      html += `<div class="sum-row"><span class="sum-label"><span class="exp-method pm-${method}" style="padding:2px 6px;border-radius:10px;font-size:11px;font-weight:700;">${method.toUpperCase()}</span></span><span class="sum-amt">$${fmt(total)}</span></div>`;
    });

    // By day
    if (dayTotals.length > 1) {
      html += '<div class="sum-section-title">By Day</div>';
      dayTotals.forEach(d => {
        html += `<div class="sum-row"><span class="sum-label">${d.label}</span><span class="sum-amt">$${fmt(d.total)}</span></div>`;
      });
    }

    html += `<div class="sum-total-row"><span>Total Logged</span><span>$${fmt(grandTotal)}</span></div>`;
  }

  document.getElementById('summary-content').innerHTML = html;
  document.getElementById('summary-overlay').classList.add('open');
}
function closeSummary(e) {
  if (!e || e.target === document.getElementById('summary-overlay')) {
    document.getElementById('summary-overlay').classList.remove('open');
  }
}

// ─────────────────────────────────────────────
init();
</script>
</body>
</html>
