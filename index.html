<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Trip 2026</title>
<style>
:root {
  --bg:       #0d1017;
  --card:     #131620;
  --border:   rgba(255,255,255,.07);
  --t1:       #e8eaf0;
  --t2:       #7a8baa;
  --t3:       #2e3d54;
  --accent:   #5599ff;
  --green:    #4ade80;
  --gbg:      #0a2018;
  --amber:    #fbbf24;
  --abg:      #1c1400;
  --font:     -apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--t1); -webkit-font-smoothing: antialiased; }

/* ── HEADER ── */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,12,20,.92); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
#hdr-top { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 16px 6px; }
#hdr-left {}
#countdown { font-size: 13px; font-weight: 800; color: var(--t1); line-height: 1.2; }
#day-summary { font-size: 11px; color: var(--t2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 90px); }
#hdr-btns { display: flex; gap: 8px; flex-shrink: 0; margin-top: 1px; }
.hdr-btn {
  background: var(--t3); border: none; border-radius: 20px;
  color: var(--t2); font-size: 11px; font-weight: 700; padding: 5px 11px;
  cursor: pointer; white-space: nowrap;
}
.hdr-btn:active { opacity: .7; }
#nav-strip { display: flex; gap: 5px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#nav-strip::-webkit-scrollbar { display: none; }
.nav-pill {
  flex-shrink: 0; padding: 4px 10px; border-radius: 20px; border: none;
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  background: var(--t3); color: var(--t2); transition: background .15s, color .15s;
}
.nav-pill.active  { background: #1e3a6e; color: #7ab3ff; }
.nav-pill.today   { background: #1e3a6e; color: #7ab3ff; outline: 1.5px solid #3a6abf; }
.nav-pill.past    { opacity: .35; }

/* ── SWIPE CONTAINER ── */
#pages {
  display: flex; overflow-x: scroll;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  position: fixed; bottom: 0; left: 0; right: 0;
}
#pages::-webkit-scrollbar { display: none; }
.day-page {
  flex-shrink: 0; width: 100vw;
  scroll-snap-align: start;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.day-page::-webkit-scrollbar { display: none; }
.page-inner { padding: 0 0 32px; }

/* ── HERO ── */
.hero { height: 120px; position: relative; overflow: hidden; }
.hero-grad { position: absolute; inset: 0; }
.hero-img  { position: absolute; inset: 0; background-size: cover; background-position: center 40%; opacity: .35; }
.hero-fade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 15%, #131620 100%); }
.hero-text { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; padding: 8px 16px 10px; }
.hero-date { font-size: 20px; font-weight: 900; color: var(--t1); line-height: 1.15; }
.hero-city { font-size: 10px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .8px; margin-top: 1px; }
.today-pill { display: inline-block; background: #e53e3e; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px; margin-left: 7px; vertical-align: middle; }

/* City gradients */
.g-nyc     { background: linear-gradient(150deg, #0a1e3d 0%, #0d3880 55%, #1a6bc4 100%); }
.g-dfw     { background: linear-gradient(150deg, #0f2744 0%, #c75000 55%, #f0853c 100%); }
.g-orlando { background: linear-gradient(150deg, #3d0030 0%, #c2156a 48%, #ff6b2b 100%); }
.g-disney  { background: linear-gradient(150deg, #0d3a7a 0%, #1976d2 48%, #90caf9 100%); }
.g-vermont { background: linear-gradient(150deg, #0b2545 0%, #1b7abf 48%, #b8e0f7 100%); }
.g-boston  { background: linear-gradient(150deg, #08142b 0%, #0d2d6e 45%, #d42b2b 100%); }

/* ── CARD SECTION ── */
.sec { padding: 12px 16px; border-top: 1px solid var(--border); }
.sec-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #4a6888; margin-bottom: 9px; }

/* ── LODGING ── */
.lodging-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.lodging-name { font-size: 13px; font-weight: 700; color: var(--t1); }
.chip { font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
.chip-ok  { background: var(--gbg); color: var(--green); }
.chip-tbc { background: var(--abg); color: var(--amber); }
.chip-ci  { color: var(--t3); font-size: 10px; font-weight: 700; }
.doc-btn { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; border: none; cursor: pointer; }
.doc-linked   { background: #162a50; color: var(--accent); }
.doc-unlinked { background: transparent; color: var(--t3); border: 1px dashed var(--t3); }

/* ── FLIGHT CARD ── */
.flight-card { border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; background: linear-gradient(135deg, #0c1f50 0%, #1040a0 100%); }
.flight-card:last-child { margin-bottom: 0; }
.flight-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.flight-num { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.5); letter-spacing: 1px; }
.flight-ok-chip { background: #166534; color: var(--green); font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
.flight-route { display: flex; align-items: center; }
.flight-iata { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -1px; }
.flight-mid { flex: 1; text-align: center; }
.flight-arrow { font-size: 11px; color: rgba(255,255,255,.35); display: block; }
.flight-times { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,.55); margin-top: 5px; }
.flight-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.flight-cabin { font-size: 10px; color: rgba(255,255,255,.45); }

/* ── TIMELINE ── */
.tl-item { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
.tl-item:last-child { margin-bottom: 0; }
.tl-time { font-size: 10px; font-weight: 800; color: #6b83a6; min-width: 44px; padding-top: 2px; flex-shrink: 0; }
.tl-icon { font-size: 13px; min-width: 18px; text-align: center; flex-shrink: 0; margin-top: 1px; }
.tl-body { flex: 1; }
.tl-text { font-size: 13px; line-height: 1.45; color: #b8c5d8; }
.tl-text strong { color: var(--t1); font-weight: 700; }
.tl-map { display: inline-block; font-size: 10px; color: var(--accent); text-decoration: none; font-weight: 700; margin-top: 3px; }
.tl-note { font-size: 11px; color: var(--t3); margin-top: 3px; line-height: 1.4; }
.tl-warn { font-size: 11px; color: var(--amber); margin-top: 3px; }

/* ── MEALS ── */
.meal-row { font-size: 13px; color: var(--t2); margin-bottom: 5px; line-height: 1.4; }
.meal-row:last-child { margin-bottom: 0; }
.meal-tag { font-size: 10px; font-weight: 800; color: var(--t3); margin-right: 5px; text-transform: uppercase; }

/* ── DOCUMENTS ── */
.doc-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
.doc-row:last-child { border-bottom: none; }
.doc-label { font-size: 12px; font-weight: 600; color: var(--t2); }

/* ── EXPENSE ── */
.exp-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.exp-total { font-size: 13px; font-weight: 800; color: var(--t1); }
.add-exp-btn { background: #1e2d4a; color: var(--accent); border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.exp-empty { font-size: 12px; color: var(--t3); font-style: italic; }
.exp-item { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.exp-item:last-child { border-bottom: none; }
.exp-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.exp-desc { flex: 1; font-size: 13px; color: var(--t1); }
.exp-pm { font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 12px; flex-shrink: 0; }
.exp-amt { font-size: 13px; font-weight: 800; color: var(--t1); flex-shrink: 0; }
.exp-del { background: none; border: none; color: var(--t3); cursor: pointer; font-size: 15px; padding: 0 3px; flex-shrink: 0; }
.exp-del:active { color: #e53e3e; }

.d-food       { background: #f59e0b; } .pm-food       { background: #2a1a00; color: #f59e0b; }
.d-transport  { background: #3b82f6; } .pm-transport  { background: #0d1f40; color: #6aabff; }
.d-activities { background: #8b5cf6; } .pm-activities { background: #1a0d35; color: #b07dff; }
.d-shopping   { background: #ec4899; } .pm-shopping   { background: #2a0820; color: #f479c0; }
.d-other      { background: #64748b; } .pm-other      { background: #151c28; color: #7a8baa; }

.pm-uob   { background: #0d1f40; color: #6aabff; }
.pm-dbs   { background: var(--gbg); color: var(--green); }
.pm-cash  { background: var(--abg); color: var(--amber); }
.pm-amex  { background: #1a0d35; color: #b07dff; }
.pm-visa  { background: #1a0f00; color: #f59e0b; }
.pm-other { background: #151c28; color: var(--t2); }

/* ── SLIDE-UP PANELS ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; }
.overlay.open { display: block; }
.panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #0f1520; border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--border);
  padding: 0 0 40px; z-index: 201;
  max-height: 80vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .28s ease;
}
.overlay.open .panel { transform: translateY(0); }
.panel-handle { width: 36px; height: 4px; background: var(--t3); border-radius: 2px; margin: 14px auto 0; }
.panel-title { font-size: 16px; font-weight: 900; color: var(--t1); padding: 14px 20px 0; }
.panel-sec { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.panel-sec:last-child { border-bottom: none; }
.panel-sec-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--t3); margin-bottom: 10px; }

/* Weather */
#wx-result { font-size: 24px; font-weight: 900; color: var(--t1); }
#wx-desc   { font-size: 12px; color: var(--t2); margin-top: 2px; }
#wx-city   { font-size: 11px; color: var(--t3); margin-top: 1px; }
#wx-loading { font-size: 12px; color: var(--t3); }

/* Currency */
#fx-rate { font-size: 12px; color: var(--t2); margin-bottom: 10px; }
#fx-rate span { color: var(--accent); font-weight: 800; }
.fx-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fx-row:last-child { margin-bottom: 0; }
.fx-input {
  flex: 1; background: var(--t3); border: none; border-radius: 8px;
  padding: 9px 10px; font-size: 15px; font-family: var(--font);
  color: var(--t1); outline: none;
}
.fx-lbl { font-size: 12px; font-weight: 800; color: var(--t2); min-width: 36px; }
.fx-arrow { font-size: 14px; color: var(--t3); }

/* Converters */
.conv-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.conv-row:last-child { margin-bottom: 0; }
.conv-input {
  flex: 1; background: var(--t3); border: none; border-radius: 8px;
  padding: 9px 10px; font-size: 15px; font-family: var(--font);
  color: var(--t1); outline: none; min-width: 0;
}
.conv-lbl { font-size: 12px; font-weight: 700; color: var(--t2); flex-shrink: 0; }
.conv-eq  { font-size: 13px; color: var(--t3); }

/* Spend summary */
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.sum-row:last-child { border-bottom: none; }
.sum-lbl  { color: var(--t2); display: flex; align-items: center; gap: 8px; }
.sum-amt  { font-weight: 800; color: var(--t1); }
.sum-total { display: flex; justify-content: space-between; padding: 14px 0 0; font-size: 17px; font-weight: 900; border-top: 2px solid var(--border); margin-top: 6px; }
.sum-sec-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--t3); margin: 14px 0 6px; }

/* ── EXPENSE MODAL ── */
#modal-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300; align-items: flex-end; }
#modal-wrap.open { display: flex; }
#modal {
  background: #0f1520; width: 100%; border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--border);
  padding: 20px 20px 44px;
}
#modal-day { font-size: 11px; color: var(--t3); font-weight: 700; margin-bottom: 3px; }
#modal-title { font-size: 17px; font-weight: 900; color: var(--t1); margin-bottom: 18px; }
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--t3); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 11px 12px; background: var(--t3); border: 1.5px solid transparent;
  border-radius: 10px; font-size: 15px; font-family: var(--font); color: var(--t1); outline: none;
  transition: border-color .15s; -webkit-appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field select option { background: #1a2030; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.btn-cancel { flex: 1; padding: 13px; border: 1px solid var(--t3); border-radius: 12px; background: transparent; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); color: var(--t2); }
.btn-save   { flex: 2; padding: 13px; border: none; border-radius: 12px; background: #1e3a6e; color: #7ab3ff; font-size: 15px; font-weight: 800; cursor: pointer; font-family: var(--font); }

@media (min-width: 600px) {
  #modal-wrap { align-items: center; }
  #modal { border-radius: 20px; max-width: 440px; margin: 0 auto; }
  .overlay .panel { max-width: 480px; left: 50%; right: auto; transform: translateX(-50%) translateY(100%); }
  .overlay.open .panel { transform: translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-top">
    <div id="hdr-left">
      <div id="countdown">Loading…</div>
      <div id="day-summary"></div>
    </div>
    <div id="hdr-btns">
      <button class="hdr-btn" onclick="location.reload()">↺</button>
      <button class="hdr-btn" onclick="openTools()">🌐 Tools</button>
      <button class="hdr-btn" onclick="openSpend()">💰 Spend</button>
    </div>
  </div>
  <div id="nav-strip"></div>
</div>

<!-- PAGES -->
<div id="pages"></div>

<!-- TOOLS PANEL -->
<div class="overlay" id="tools-ov" onclick="closeTools(event)">
  <div class="panel">
    <div class="panel-handle"></div>
    <div class="panel-title">Tools</div>

    <div class="panel-sec">
      <div class="panel-sec-title">🌤 Weather — <span id="wx-city-label"></span></div>
      <div id="wx-loading">Fetching…</div>
      <div id="wx-result" style="display:none"></div>
      <div id="wx-desc"  style="display:none"></div>
    </div>

    <div class="panel-sec">
      <div class="panel-sec-title">💱 Currency</div>
      <div id="fx-rate">Loading rate…</div>
      <div class="fx-row">
        <input class="fx-input" id="fx-usd" type="number" placeholder="USD" oninput="calcFx('usd')">
        <span class="fx-lbl">USD</span>
        <span class="fx-arrow">⇄</span>
        <input class="fx-input" id="fx-sgd" type="number" placeholder="SGD" oninput="calcFx('sgd')">
        <span class="fx-lbl">SGD</span>
      </div>
    </div>

    <div class="panel-sec">
      <div class="panel-sec-title">📏 Height</div>
      <div class="conv-row">
        <input class="conv-input" id="h-ft"  type="number" placeholder="ft"  oninput="calcHeight('imp')">
        <span class="conv-lbl">ft</span>
        <input class="conv-input" id="h-in"  type="number" placeholder="in"  oninput="calcHeight('imp')">
        <span class="conv-lbl">in</span>
        <span class="conv-eq">=</span>
        <input class="conv-input" id="h-cm"  type="number" placeholder="cm"  oninput="calcHeight('met')">
        <span class="conv-lbl">cm</span>
      </div>
    </div>

    <div class="panel-sec">
      <div class="panel-sec-title">⚖️ Weight</div>
      <div class="conv-row">
        <input class="conv-input" id="w-lbs" type="number" placeholder="lbs" oninput="calcWeight('imp')">
        <span class="conv-lbl">lbs</span>
        <span class="conv-eq">=</span>
        <input class="conv-input" id="w-kg"  type="number" placeholder="kg"  oninput="calcWeight('met')">
        <span class="conv-lbl">kg</span>
      </div>
    </div>
  </div>
</div>

<!-- SPEND PANEL -->
<div class="overlay" id="spend-ov" onclick="closeSpend(event)">
  <div class="panel">
    <div class="panel-handle"></div>
    <div class="panel-title">Trip Spend</div>
    <div class="panel-sec" id="spend-content">
      <div style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">No expenses logged yet</div>
    </div>
  </div>
</div>

<!-- EXPENSE MODAL -->
<div id="modal-wrap" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-day"></div>
    <div id="modal-title">Add Expense</div>
    <div class="field"><label>Description</label><input id="e-desc" type="text" placeholder="e.g. Coffee at JFK" autocomplete="off"></div>
    <div class="field"><label>Amount (USD)</label><input id="e-amt" type="number" step="0.01" min="0" placeholder="0.00"></div>
    <div class="field"><label>Category</label>
      <select id="e-cat">
        <option value="food">🍽️ Food &amp; Drink</option>
        <option value="transport">🚗 Transport</option>
        <option value="activities">🎢 Activities</option>
        <option value="shopping">🛍️ Shopping</option>
        <option value="other">📌 Other</option>
      </select>
    </div>
    <div class="field"><label>Payment Method</label>
      <select id="e-method">
        <option value="uob">UOB</option>
        <option value="dbs">DBS</option>
        <option value="cash">Cash (USD)</option>
        <option value="amex">Amex</option>
        <option value="visa">Visa</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save"   onclick="saveExpense()">Add</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────
   IMAGES
───────────────────────────────────────── */
const IMG = {
  nyc:     'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=800&q=75&auto=format&fit=crop',
  dfw:     'https://images.unsplash.com/photo-1533581464688-632317676a87?w=800&q=75&auto=format&fit=crop',
  orlando: 'https://images.unsplash.com/photo-1547675960-7634cf1b0856?w=800&q=75&auto=format&fit=crop',
  disney:  'https://images.unsplash.com/photo-1577493340887-b7bfff550145?w=800&q=75&auto=format&fit=crop',
  vermont: 'https://images.unsplash.com/photo-1551524559-8af4e6624178?w=800&q=75&auto=format&fit=crop',
  boston:  'https://images.unsplash.com/photo-1587474260584-136574528ed5?w=800&q=75&auto=format&fit=crop'
};

const WEATHER_CITY = {
  nyc: 'New York City', dfw: 'Fort Worth Texas',
  orlando: 'Orlando Florida', disney: 'Orlando Florida',
  vermont: 'Jeffersonville Vermont', boston: 'Boston Massachusetts'
};

/* ─────────────────────────────────────────
   TRIP DATA
───────────────────────────────────────── */
const DAYS = [
  {
    id:'dec14', date:'2026-12-14', label:'14 Dec', day:'Monday',
    city:'New York City', theme:'nyc',
    summary:'Arrive JFK · Check in Times Square',
    lodging:{ name:'Residence Inn Times Square', status:'booked', ci:true, co:false, doc:null },
    flights:[{ num:'SQ24', airline:'Singapore Airlines', from:'SIN', to:'JFK', dep:'12:10 SIN (13 Dec)', arr:'18:50 JFK', cabin:'Premium Economy', doc:null }],
    docs:[],

const SK = 'holiday2026_exp';
const CAT = {
  food:       { label:'Food & Drink',  dot:'d-food',       pm:'pm-food'       },
  transport:  { label:'Transport',     dot:'d-transport',  pm:'pm-transport'  },
  activities: { label:'Activities',    dot:'d-activities', pm:'pm-activities' },
  shopping:   { label:'Shopping',      dot:'d-shopping',   pm:'pm-shopping'   },
  other:      { label:'Other',         dot:'d-other',      pm:'pm-other'      }
};
const loadExp  = () => { try { return JSON.parse(localStorage.getItem(SK)||'{}'); } catch { return {}; } };
const saveExp  = d  => localStorage.setItem(SK, JSON.stringify(d));
const getDayExp = dt => loadExp()[dt] || [];
const addExp = (dt, item) => { const d=loadExp(); if(!d[dt])d[dt]=[]; d[dt].push({...item, id:Date.now()}); saveExp(d); };
const delExp = (dt, id) => { const d=loadExp(); if(d[dt])d[dt]=d[dt].filter(e=>e.id!==id); saveExp(d); };
const fmt = n => (+n).toFixed(2);

function expListHTML(dt) {
  const items = getDayExp(dt);
  if(!items.length) return '<div class="exp-empty">No expenses logged yet</div>';
  return items.map(e => {
    const m = CAT[e.cat]||CAT.other;
    return `<div class="exp-item" id="ei-${e.id}">
      <div class="exp-dot ${m.dot}"></div>
      <div class="exp-desc">${e.desc}</div>
      <span class="exp-pm pm-${e.method}">${e.method.toUpperCase()}</span>
      <div class="exp-amt">$${fmt(e.amt)}</div>
      <button class="exp-del" onclick="onDelExp('${dt}',${e.id})">×</button>
    </div>`;
  }).join('');
}

/* ─────────────────────────────────────────
   RENDER
───────────────────────────────────────── */
function renderDay(day) {
  const isToday = day.date === TODAY;
  const todayPill = isToday ? '<span class="today-pill">Today</span>' : '';
  const img = IMG[day.theme] ? `url('${IMG[day.theme]}')` : '';

  // Lodging
  let lodging = '';
  if(day.lodging) {
    const chip = day.lodging.status==='booked'
      ? '<span class="chip chip-ok">✓ Booked</span>'
      : '<span class="chip chip-tbc">⚠ Cost TBC</span>';
    const ci = day.lodging.ci ? '<span class="chip-ci">Check-in</span>' : '';
    const co = day.lodging.co ? '<span class="chip-ci">Check-out</span>' : '';
    const docBtn = day.lodging.doc
      ? `<a class="doc-btn doc-linked" href="${day.lodging.doc}" target="_blank">📄 Receipt</a>`
      : '<button class="doc-btn doc-unlinked">📄 Receipt — not linked</button>';
    lodging = `<div class="sec"><div class="sec-lbl">Lodging</div>
      <div class="lodging-row">
        <span class="lodging-name">${day.lodging.name}</span>
        ${chip}${ci}${co}${docBtn}
      </div>
    </div>`;
  }

  // Flights
  let flights = '';
  if(day.flights && day.flights.length) {
    const cards = day.flights.map(f => {
      const docBtn = f.doc
        ? `<a class="doc-btn doc-linked" href="${f.doc}" target="_blank">🎫 Boarding pass</a>`
        : '<button class="doc-btn doc-unlinked">🎫 Boarding pass — not linked</button>';
      return `<div class="flight-card">
        <div class="flight-top">
          <span class="flight-num">${f.num} · ${f.airline}</span>
          <span class="flight-ok-chip">✓ Booked</span>
        </div>
        <div class="flight-route">
          <span class="flight-iata">${f.from}</span>
          <div class="flight-mid"><span class="flight-arrow">───────✈───────</span></div>
          <span class="flight-iata">${f.to}</span>
        </div>
        <div class="flight-times"><span>${f.dep}</span><span>${f.arr}</span></div>
        <div class="flight-meta"><span class="flight-cabin">${f.cabin}</span>${docBtn}</div>
      </div>`;
    }).join('');
    flights = `<div class="sec">${cards}</div>`;
  }

  // Timeline
  const tl = day.timeline.map(t => {
    const mapLink = t.map ? `<a class="tl-map" href="${t.map}" target="_blank">📍 Maps</a>` : '';
    const warn = t.warn ? `<div class="tl-warn">⚠️ ${t.warn}</div>` : '';
    return `<div class="tl-item">
      <div class="tl-time">${t.time}</div>
      <div class="tl-icon">${t.icon}</div>
      <div class="tl-body">
        <div class="tl-text">${t.text}</div>
        ${mapLink}${warn}
      </div>
    </div>`;
  }).join('');

  // Meals
  let meals = '';
  if(day.meals && day.meals.length) {
    const rows = day.meals.map(m => `<div class="meal-row"><span class="meal-tag">${m.tag}</span>${m.text}</div>`).join('');
    meals = `<div class="sec"><div class="sec-lbl">Meals</div>${rows}</div>`;
  }

  // Documents
  let docs = '';
  if(day.docs && day.docs.length) {
    const rows = day.docs.map(d => {
      const btn = d.doc
        ? `<a class="doc-btn doc-linked" href="${d.doc}" target="_blank">📄 Open</a>`
        : '<button class="doc-btn doc-unlinked">📄 Not linked</button>';
      return `<div class="doc-row"><span class="doc-label">${d.label}</span>${btn}</div>`;
    }).join('');
    docs = `<div class="sec"><div class="sec-lbl">Documents</div>${rows}</div>`;
  }

  // Expenses
  const dayTotal = getDayExp(day.date).reduce((s,e)=>s+Number(e.amt),0);
  const totalLabel = dayTotal>0 ? `$${fmt(dayTotal)} logged` : 'No expenses logged';
  const expSec = `<div class="sec">
    <div class="sec-lbl">Expense Log</div>
    <div class="exp-hdr">
      <span class="exp-total" id="et-${day.date}">${totalLabel}</span>
      <button class="add-exp-btn" onclick="openModal('${day.date}','${day.label}')">+ Add</button>
    </div>
    <div id="el-${day.date}">${expListHTML(day.date)}</div>
  </div>`;

  return `<div class="page-inner">
    <div class="hero">
      <div class="hero-grad g-${day.theme}"></div>
      ${img ? `<div class="hero-img" style="background-image:${img}"></div>` : ''}
      <div class="hero-fade"></div>
      <div class="hero-text">
        <div class="hero-date">${day.label} — ${day.day}${todayPill}</div>
        <div class="hero-city">${day.city}</div>
      </div>
    </div>
    ${lodging}${flights}
    <div class="sec"><div class="sec-lbl">Plan</div>${tl}</div>
    ${meals}${docs}${expSec}
  </div>`;
}

const TODAY = new Date().toISOString().slice(0,10);
let currentPage = 0;

function buildNav() {
  const strip = document.getElementById('nav-strip');
  strip.innerHTML = DAYS.map((d,i) => {
    let cls = 'nav-pill';
    if(d.date === TODAY) cls += ' today';
    else if(d.date < TODAY) cls += ' past';
    return `<button class="${cls}" id="pill-${i}" onclick="goTo(${i})">${d.label}</button>`;
  }).join('');
}

function buildPages() {
  const container = document.getElementById('pages');
  container.innerHTML = DAYS.map(d => `<div class="day-page" id="page-${d.id}">${renderDay(d)}</div>`).join('');
}

function goTo(i) {
  const container = document.getElementById('pages');
  container.scrollTo({ left: i * container.offsetWidth, behavior: 'smooth' });
}

function setContainerHeight() {
  const hdr = document.getElementById('hdr').offsetHeight;
  const pages = document.getElementById('pages');
  pages.style.top = hdr + 'px';
  pages.style.height = `calc(100dvh - ${hdr}px)`;
  // fallback for browsers without dvh
  pages.style.height = `calc(${window.innerHeight}px - ${hdr}px)`;
}

function updateHeader(i) {
  currentPage = i;
  const day = DAYS[i];

  // Countdown
  const el = document.getElementById('countdown');
  const today = new Date(TODAY);
  const tripStart = new Date('2026-12-14');
  const tripEnd   = new Date('2027-01-01');
  if(today < tripStart) {
    const diff = Math.ceil((tripStart - today) / 86400000);
    el.textContent = `${diff} day${diff!==1?'s':''} to go ✈️`;
  } else if(today <= tripEnd) {
    const dayNum = Math.floor((today - tripStart) / 86400000) + 1;
    el.textContent = `Day ${dayNum} of 18 🌍`;
  } else {
    el.textContent = 'Trip complete 🏠';
  }

  // Summary
  document.getElementById('day-summary').textContent = day.summary;

  // Pills
  document.querySelectorAll('.nav-pill').forEach((p,idx) => {
    p.classList.toggle('active', idx === i);
  });
  const activePill = document.getElementById(`pill-${i}`);
  if(activePill) activePill.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}

/* ─────────────────────────────────────────
   TOOLS PANEL
───────────────────────────────────────── */
let fxRate = null;
let fxUpdated = 0;

async function openTools() {
  document.getElementById('tools-ov').classList.add('open');
  const day = DAYS[currentPage];
  const city = WEATHER_CITY[day.theme] || 'New York City';
  document.getElementById('wx-city-label').textContent = city;

  // Weather
  document.getElementById('wx-loading').style.display = 'block';
  document.getElementById('wx-result').style.display = 'none';
  document.getElementById('wx-desc').style.display = 'none';
  try {
    const r = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
    const data = await r.json();
    const c = data.current_condition[0];
    document.getElementById('wx-result').textContent = `${c.temp_C}°C`;
    document.getElementById('wx-desc').textContent = c.weatherDesc[0].value;
    document.getElementById('wx-loading').style.display = 'none';
    document.getElementById('wx-result').style.display = 'block';
    document.getElementById('wx-desc').style.display = 'block';
  } catch {
    document.getElementById('wx-loading').textContent = 'Weather unavailable — check connection';
  }

  // FX rate — refresh every 5 min
  if(!fxRate || Date.now() - fxUpdated > 300000) {
    document.getElementById('fx-rate').textContent = 'Fetching rate…';
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/USD');
      const data = await r.json();
      fxRate = data.rates.SGD;
      fxUpdated = Date.now();
    } catch { fxRate = null; }
  }
  const rateEl = document.getElementById('fx-rate');
  const updStr = fxUpdated ? ` · ${new Date(fxUpdated).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}` : '';
  rateEl.innerHTML = fxRate
    ? `1 USD = <span>SGD ${fxRate.toFixed(4)}</span>${updStr}`
    : 'Rate unavailable — check connection';
}
function closeTools(e) {
  if(!e || e.target===document.getElementById('tools-ov'))
    document.getElementById('tools-ov').classList.remove('open');
}

function calcFx(from) {
  if(!fxRate) return;
  if(from==='usd') {
    const v = parseFloat(document.getElementById('fx-usd').value);
    document.getElementById('fx-sgd').value = isNaN(v)?'': (v*fxRate).toFixed(2);
  } else {
    const v = parseFloat(document.getElementById('fx-sgd').value);
    document.getElementById('fx-usd').value = isNaN(v)?'': (v/fxRate).toFixed(2);
  }
}
function calcHeight(dir) {
  if(dir==='imp') {
    const ft=parseFloat(document.getElementById('h-ft').value)||0;
    const inc=parseFloat(document.getElementById('h-in').value)||0;
    document.getElementById('h-cm').value = ((ft*12+inc)*2.54).toFixed(1);
  } else {
    const cm=parseFloat(document.getElementById('h-cm').value);
    if(isNaN(cm))return;
    const totalIn=cm/2.54;
    document.getElementById('h-ft').value=Math.floor(totalIn/12);
    document.getElementById('h-in').value=(totalIn%12).toFixed(1);
  }
}
function calcWeight(dir) {
  if(dir==='imp') {
    const lbs=parseFloat(document.getElementById('w-lbs').value);
    document.getElementById('w-kg').value=isNaN(lbs)?'':(lbs/2.2046).toFixed(2);
  } else {
    const kg=parseFloat(document.getElementById('w-kg').value);
    document.getElementById('w-lbs').value=isNaN(kg)?'':(kg*2.2046).toFixed(2);
  }
}

function openSpend() {
  // ── Committed costs ──────────────────────────────
  const lockedByCat = {};
  const lockedTotal = LOCKED_COSTS.reduce((s,e)=>{ lockedByCat[e.cat]=(lockedByCat[e.cat]||0)+e.amt; return s+e.amt; }, 0);
  const catMeta = {
    flights:    { label:'Flights',                 color:'#6aabff' },
    hotels:     { label:'Hotels',                  color:'#4ade80' },
    activities: { label:'Activities & Tickets',    color:'#b07dff' },
    transport:  { label:'Ground Transport',        color:'#f59e0b' },
  };

  let html = '<div class="sum-sec-title">Committed (Booked & Paid)</div>';
  Object.entries(lockedByCat).forEach(([cat,amt])=>{
    const m = catMeta[cat]||{label:cat,color:'#7a8baa'};
    html += `<div class="sum-row">
      <span class="sum-lbl"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${m.color};margin-right:8px;flex-shrink:0"></span>${m.label}</span>
      <span class="sum-amt">$${fmt(amt)}</span>
    </div>`;
  });
  html += `<div style="font-size:11px;color:var(--amber);margin:4px 0 6px;padding-left:4px">⚠ Worthington Renaissance (Fort Worth, 2 nts) — cost TBC, excluded</div>`;
  html += `<div class="sum-total" style="font-size:15px"><span>Committed Total</span><span>$${fmt(lockedTotal)}</span></div>`;

  // ── Variable logged ───────────────────────────────
  const all = loadExp();
  const catT={}, methodT={}, dayT=[];
  let varTotal=0;
  Object.entries(all).forEach(([dt,items])=>{
    if(!items.length)return;
    const s=items.reduce((a,e)=>a+Number(e.amt),0);
    varTotal+=s;
    const d=DAYS.find(x=>x.date===dt);
    if(d) dayT.push({label:d.label,total:s});
    items.forEach(e=>{
      catT[e.cat]=(catT[e.cat]||0)+Number(e.amt);
      methodT[e.method]=(methodT[e.method]||0)+Number(e.amt);
    });
  });

  html += '<div class="sum-sec-title" style="margin-top:18px">Variable Logged (Delta)</div>';
  if(!varTotal){
    html += '<div style="color:var(--t3);font-size:13px;padding:6px 0 10px">No variable expenses logged yet</div>';
  } else {
    html += '<div class="sum-sec-title" style="font-size:9px;margin-top:4px;text-transform:none;letter-spacing:.3px">By Category</div>';
    Object.entries(catT).sort((a,b)=>b[1]-a[1]).forEach(([c,t])=>{
      const m=CAT[c]||CAT.other;
      html+=`<div class="sum-row"><span class="sum-lbl"><span class="exp-dot ${m.dot}" style="width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0"></span>&nbsp;${m.label}</span><span class="sum-amt">$${fmt(t)}</span></div>`;
    });
    html += '<div class="sum-sec-title" style="font-size:9px;margin-top:10px;text-transform:none;letter-spacing:.3px">By Payment Method</div>';
    Object.entries(methodT).sort((a,b)=>b[1]-a[1]).forEach(([m,t])=>{
      html+=`<div class="sum-row"><span class="sum-lbl"><span class="exp-pm pm-${m}" style="padding:2px 7px;border-radius:12px;font-size:10px;font-weight:800">${m.toUpperCase()}</span></span><span class="sum-amt">$${fmt(t)}</span></div>`;
    });
    if(dayT.length>1){
      html += '<div class="sum-sec-title" style="font-size:9px;margin-top:10px;text-transform:none;letter-spacing:.3px">By Day</div>';
      dayT.forEach(d=>{ html+=`<div class="sum-row"><span class="sum-lbl">${d.label}</span><span class="sum-amt">$${fmt(d.total)}</span></div>`; });
    }
  }
  html += `<div class="sum-total" style="font-size:15px"><span>Variable Total</span><span>$${fmt(varTotal)}</span></div>`;

  // ── Grand total ───────────────────────────────────
  html += `<div class="sum-total" style="font-size:19px;font-weight:900;border-top:2px solid var(--accent);margin-top:6px;padding-top:14px"><span>Grand Total</span><span>$${fmt(lockedTotal+varTotal)}</span></div>`;

  document.getElementById('spend-content').innerHTML=html;
  document.getElementById('spend-ov').classList.add('open');
}
function closeSpend(e) {
  if(!e || e.target===document.getElementById('spend-ov'))
    document.getElementById('spend-ov').classList.remove('open');
}

/* ─────────────────────────────────────────
   EXPENSE MODAL
───────────────────────────────────────── */
let modalDate=null;
function openModal(dt,label) {
  modalDate=dt;
  document.getElementById('modal-day').textContent=label;
  document.getElementById('e-desc').value='';
  document.getElementById('e-amt').value='';
  document.getElementById('e-cat').value='food';
  document.getElementById('e-method').value='uob';
  document.getElementById('modal-wrap').classList.add('open');
  setTimeout(()=>document.getElementById('e-desc').focus(),300);
}
function closeModal(e) {
  if(!e || e.target===document.getElementById('modal-wrap'))
    document.getElementById('modal-wrap').classList.remove('open');
  modalDate=null;
}
function saveExpense() {
  if(!modalDate) return;
  const desc=document.getElementById('e-desc').value.trim();
  const amt=parseFloat(document.getElementById('e-amt').value);
  if(!desc||isNaN(amt)||amt<=0){alert('Enter a description and a valid amount.');return;}
  addExp(modalDate,{desc,amt,cat:document.getElementById('e-cat').value,method:document.getElementById('e-method').value});
  refreshExpSection(modalDate);
  closeModal();
}
function onDelExp(dt,id) {
  delExp(dt,id);
  refreshExpSection(dt);
}
function refreshExpSection(dt) {
  const el=document.getElementById(`el-${dt}`);
  if(el) el.innerHTML=expListHTML(dt);
  const tot=getDayExp(dt).reduce((s,e)=>s+Number(e.amt),0);
  const te=document.getElementById(`et-${dt}`);
  if(te) te.textContent=tot>0?`$${fmt(tot)} logged`:'No expenses logged';
}

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
function init() {
  buildNav();
  buildPages();
  setContainerHeight();
  window.addEventListener('resize', setContainerHeight);

  const container = document.getElementById('pages');
  container.addEventListener('scroll', debounce(() => {
    const i = Math.round(container.scrollLeft / container.offsetWidth);
    if(i !== currentPage) updateHeader(i);
  }, 80), { passive: true });

  // Jump to today (or first day if pre-trip)
  let startIdx = DAYS.findIndex(d => d.date === TODAY);
  if(startIdx < 0) {
    startIdx = TODAY < DAYS[0].date ? 0 : DAYS.length - 1;
  }
  updateHeader(startIdx);
  if(startIdx > 0) {
    setTimeout(() => {
      const container = document.getElementById('pages');
      container.scrollLeft = startIdx * container.offsetWidth;
    }, 50);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
